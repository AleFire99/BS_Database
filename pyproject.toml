[project]
name = "bs-database"
version = "0.5.0"
description = "Battle Spirits card database: scraper, normalization and DB tooling."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "typer>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true

[project.scripts]
bsdb = "bs_database.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
# Offline machine translation (#102); optional, not installed in CI.
mt = [
    "ctranslate2>=4.9,<5",
    "sentencepiece>=0.2.1,<0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Gate for the scraper rewrite (#71), the glossary (#92), the normalize package (#93), the translator (#94) and the build (#120).
# cli.py is not gated here.
include = [
    "src/bs_database/ingest/*",
    "src/bs_database/parsers/*",
    "src/bs_database/glossary.py",
    "src/bs_database/review/*",
    "src/bs_database/normalize/*",
    "src/bs_database/translate/*",
    "src/bs_database/build/*",
]
fail_under = 97
show_missing = true
