[project]
name = "bs-database"
version = "0.3.0"
description = "Battle Spirits card database: scrapers, translation and DB tooling."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "deep-translator>=1.11.4",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
    "typer>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true

[project.scripts]
bsdb = "bs_database.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[tool.coverage.run]
source = ["src"]
