[project]
name = "bs-database"
version = "0.1.0"
description = "Battle Spirits card database: scrapers, translation and DB tooling."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "deep-translator>=1.11.4",
    "libretranslatepy>=2.1.4",
    "lxml>=6.1.3",
    "requests>=2.34.2",
    "selenium>=4.52.0",
    "sqlalchemy>=2.1.8",
    "webdriver-manager>=4.1.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# legacy, cleaned up in E2 (#7)
extend-exclude = ["main.py", "json_editor.py", "config", "scripts", "data", "selenium"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[tool.coverage.run]
source = ["src"]
