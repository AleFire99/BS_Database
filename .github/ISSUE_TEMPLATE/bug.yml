name: Bug
description: Something is broken
title: ""
labels: ["type:bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - scraper
        - translation
        - db
        - images
        - docs
        - infra
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: false
