name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Enforce uv only
        run: |
          found=$(ls requirements*.txt setup.py Pipfile poetry.lock 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "::error::uv only - remove: $found"
            exit 1
          fi
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing
      - name: No absolute user paths
        run: |
          if git grep -nE '[A-Za-z]:\\Users\\|/home/[a-z]|/Users/[A-Za-z]' -- '*.py' '*.toml' '*.yml' '*.yaml' '*.cfg' '*.ini' ':!.github/workflows/ci.yml'; then
            echo "::error::absolute user path found"
            exit 1
          fi
