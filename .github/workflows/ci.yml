name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Enforce uv only
        run: |
          found=$(ls requirements*.txt setup.py Pipfile poetry.lock 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "::error::uv only - remove: $found"
            exit 1
          fi
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing
      - name: No absolute user paths
        run: |
          if git grep -nE '[A-Za-z]:\\Users\\|/home/[a-z]|/Users/[A-Za-z]' -- '*.py' '*.toml' '*.yml' '*.yaml' '*.cfg' '*.ini' ':!.github/workflows/ci.yml'; then
            echo "::error::absolute user path found"
            exit 1
          fi

  db-build:
    name: db-build
    runs-on: ubuntu-latest
    env:
      BSDB_NORMALIZED_DIR: tests/goldens/normalized
      BUILT_AT: "2026-01-01T00:00:00Z"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Build the database from the fixtures
        run: uv run bsdb build --out build/fixtures.db --built-at "$BUILT_AT"
      - name: Check the build is deterministic
        run: |
          uv run bsdb build --out build/again.db --built-at "$BUILT_AT"
          cmp build/fixtures.db build/again.db
      - name: Add the build report to the job summary
        if: always()
        run: |
          if [ -f build/fixtures.build_report.md ]; then
            cat build/fixtures.build_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the build report and database
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-db-build
          path: |
            build/fixtures.build_report.json
            build/fixtures.build_report.md
            build/fixtures.db
          if-no-files-found: warn
